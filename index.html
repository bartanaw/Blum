<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scam Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        textarea {
            width: 100%;
            height: 150px;
        }
        .result {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Simple Scam Detector</h1>
    <p>Paste text from an email, website, or message to analyze if it might be a scam.</p>
    <textarea id="input" placeholder="Enter text or URL here"></textarea>
    <br>
    <button onclick="detectScam()">Analyze</button>
    <p class="result" id="result"></p>
    <script src="script.js"></script>
</body>
</html>
